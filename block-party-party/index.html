e top left; tap one there to take it back (unless take-backs are off).`,`A wrong fourth icon, running out of time or giving up costs a point (never in Detective).`],modes:[{name:`Detective`,text:`Its own row on the home screen, at three levels (Full, Medium, Simple): one hunt a day at each, on the day’s table (the same for everyone), and the cubes stay put. Find every party on it; tap ??? to see how many there are. Finding one again is a strike, counted but free. Parties you find go in the bank under the board, hidden: tap one to peek.`},{name:`∞`,text:`Solo and endless: each party scores a point and its cubes roll to new faces.`},{name:`Runner`,text:`Solo against the clock: a minute to start, and each party adds 10 seconds. Find as many as you can before it runs out.`},{name:`VS`,text:`2 to 4 players on one phone. Press your PARTY! button first, then tap the four icons before your time runs out.`}],tips:[`Each icon is printed on several cubes, so a party can have twins: other parties made of the same four icons. Detective banks them with it.`,`Classic’s menu (from VS) sets the timer, take-backs and training, which greys out icons that can’t finish a party.`]},crusher:{title:`Crusher`,goal:`Set off lines of sub parties to score, and keep the chain going.`,how:[`Alter: tap an icon to change one thing about it. The big tile on the right of the queue says what (a color, a shape or a fill), and the next four are lined up to its left.`,`Swap: tap an icon, then one next to it (across or down), to trade their places.`,(0,V.jsxs)(V.Fragment,{children:[`Any straight line of three, across or down, that is a sub party explodes. `,hr]}),`A longer run explodes only if every three in a row of it is a sub party. Where two lines in a row share an icon, the one worth more explodes (the left or bottom one on a tie); a line across and a line down can share one.`,`Icons above fall into the gaps and new ones drop in; lines they make explode too, and each wave of a chain scores more.`,`Each exploded icon is worth 10, a line of four that is a full party +100, a run of five +100, and an L, T or cross +50.`,`Moves in a row that set something off build a streak, multiplying your points up to ×3. A move that sets nothing off breaks it.`,`PARTY POWER: your 4th, 8th and 16th moves that set something off, and every 16th after (32nd, 48th, 64th…), each earn one. Tap it to give every icon on the board its color, shape or fill. Save them up if you like.`],modes:[{name:`Alter and Swap`,text:`The Daily Boards: 120 seconds on the clock, and every move that sets something off adds 20. One board a day, the same for everyone.`},{name:`Alter ∞ and Swap ∞`,text:`Infinite Runners: no clock, play as long as you like. New game banks your score for the day.`}]},links:{title:`Links and Hexlinks`,goal:`Find runs of sub parties by dragging through neighbouring icons.`,how:[`Drag from icon to icon. On Links (the square board) every neighbour counts, diagonals too; on Hexlinks each hexagon touches up to six.`,(0,V.jsxs)(V.Fragment,{children:[`Every three icons in a row along your path must be a sub party, and each icon can be used once. `,hr]}),`Let go to submit the run. Slide back onto the previous icon to take the last one off.`,`A run of 3 scores 1, 4 scores 3, 5 scores 6, 6 scores 10... Finding a longer run swallows any shorter run you had inside it.`,`“Longest left” is the length of the longest run you haven’t found yet.`],modes:[{name:`∞`,text:`No clock. Press Finish when you’re done.`},{name:`Rush`,text:`2 minutes. Each new run adds its length less 2 seconds (a run of 5 adds 3).`},{name:`Blitz`,text:`A race against the clock, counting up: find one of the board’s longest runs (Target says how long) as fast as you can. Only a run that long counts. One board a day, the same for everyone.`}],tips:[`Hint fades every icon that doesn’t start one of the longest runs left.`,`When time’s up, tap a missed run to see it drawn on the board.`]},costume:{title:`Alter Icon`,goal:`Clear the whole board with three changes.`,how:[`You get three changes (fewer in the first tutorials), used in order: the big tile on the right is next. Each changes one icon’s color, shape or fill.`,(0,V.jsxs)(V.Fragment,{children:[`Every change must set off at least one line of three, across or down, that is a sub party. `,hr]}),`Exploded icons are gone: the rest fall down, and an empty column slides left. Lines made by falling icons explode too.`,`Clear every icon with the last change to win. Run out first and you can try again.`],tips:[`Hint lights up where the next change has to go; if the board can no longer be cleared it says so.`,`A move the game refuses (one that sets nothing off) counts as a mistake.`,`Clear it on your first try, with no hints and no mistakes, to earn ONE SHOT GOD.`]},crashers:{title:`Party crashers`,goal:`Find the icons that don’t belong.`,how:[(0,V.jsxs)(V.Fragment,{children:[`On a correct board every line of three, across and down, is a sub party. `,hr]}),`A few icons, the crashers, have been changed, so the lines through them are broken. The title says how many.`,`Tap icons to pick them (tap again to drop one). When you’ve picked that many, they explode if you’re right; otherwise it’s a miss.`,`The broken lines always give the crashers away: they’re the only icons that touch every broken line.`],tips:[`Hint lights up one crasher you haven’t picked.`,`Get it on your first guess without a hint for ONE SHOT GOD.`]},swapper:{title:`Swaps`,goal:`Trade icons’ places until every line of three is a sub party.`,how:[(0,V.jsxs)(V.Fragment,{children:[`On a correct board every line of three, across and down, is a sub party. `,hr]}),`The board has been mixed up with a few swaps; the tiles under the board show how many you have to fix it.`,`Tap one icon, then another, to trade their places. Tap a picked icon again to drop it.`,`Any arrangement where every line is a sub party wins, not just the original one.`],modes:[{name:`Pairs`,text:`Separate pairs we
